{% extends "admin/base_site.html" %}

{% block extrastyle %}
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    :root, [data-theme="dark"], [data-theme="light"] {
        --primary-color: #3c133a;
        --primary-hover: #250924;
        --accent-color: #d81b60;
        --morado-claro: #f4eef4;
        --body-bg: #f4eef4 !important;
        --body-quiet-color: #666666 !important;
        --body-loud-color: #2b2b2b !important;
    }

    /* --- FONDO GENERAL PASTEL (IGUAL A LA WEB DULCE ARTE) --- */
    html, body, #container {
        background-color: var(--morado-claro) !important;
        color: #2b2b2b !important;
        font-family: 'Plus Jakarta Sans', sans-serif !important;
    }

    /* --- BARRA SUPERIOR --- */
    #header {
        background-color: var(--primary-color) !important;
        color: #ffffff !important;
        border-bottom: 4px solid var(--accent-color);
        padding: 12px 24px;
        box-shadow: 0 4px 15px rgba(60, 19, 58, 0.15);
    }

    #header a:link, #header a:visited, #user-tools a {
        color: #ffffff !important;
    }

    #user-tools {
        color: rgba(255, 255, 255, 0.85) !important;
    }

    #branding h1 a {
        color: #ffffff !important;
        font-weight: 700;
        font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* --- CONTENEDOR DE CONTENIDO PRINCIPAL --- */
    #content {
        padding: 24px !important;
        background-color: transparent !important;
    }

    #content-main {
        background: transparent !important;
    }

    /* --- TARJETAS DE MÓDULOS (CORE Y AUTENTICACIÓN) --- */
    .module {
        background: #ffffff !important;
        border-radius: 1rem !important;
        border: 1px solid rgba(60, 19, 58, 0.08) !important;
        box-shadow: 0 8px 24px rgba(60, 19, 58, 0.06) !important;
        overflow: hidden !important;
        margin-bottom: 24px !important;
    }

    /* Encabezados Morados de Cada Módulo */
    .module h2, 
    .module caption, 
    .inline-group h2, 
    table caption {
        background: var(--primary-color) !important;
        color: #ffffff !important;
        font-weight: 700 !important;
        font-size: 0.9rem !important;
        letter-spacing: 1px !important;
        text-transform: uppercase !important;
        padding: 12px 18px !important;
        border: none !important;
    }

    .module caption a, table caption a {
        color: #ffffff !important;
    }

    /* --- TABLAS Y FILAS INTUITIVAS --- */
    .module table, #changelist table, .results table {
        background-color: #ffffff !important;
        width: 100% !important;
        border-collapse: collapse !important;
    }

    /* Filas alternadas suaves */
    .module tr, table tr {
        background-color: #ffffff !important;
        border-bottom: 1px solid #f0e6f0 !important;
    }

    .module tr:hover, table tr:hover {
        background-color: #faf4fa !important;
    }

    /* Texto y Enlaces de los Modelos (Despachos, Insumos, Pedidos, etc.) */
    .module td, .module th, table td, table th {
        color: #2b2b2b !important;
        padding: 14px 18px !important;
        vertical-align: middle !important;
    }

    /* Enlaces Principales Legibles */
    .module th a, .module td a, #content a:link, #content a:visited {
        color: var(--primary-color) !important;
        font-weight: 700 !important;
        text-decoration: none !important;
        font-size: 0.95rem !important;
    }

    .module th a:hover, .module td a:hover {
        color: var(--accent-color) !important;
        text-decoration: underline !important;
    }

    /* Botones "+ Add" y "Change" */
    .addlink {
        color: #27ae60 !important;
        font-weight: 600 !important;
        padding-left: 20px !important;
    }

    .changelink, .inlinechangelink {
        color: #d35400 !important;
        font-weight: 600 !important;
        padding-left: 20px !important;
    }

    .deletelink {
        color: #c0392b !important;
        font-weight: 600 !important;
    }

    /* --- BLOQUE DE ACCIONES RECIENTES (SIDEBAR DERECHO) --- */
    #recent-actions-module, .module#recent-actions-module {
        background: #ffffff !important;
        border-radius: 1rem !important;
        padding: 0 !important;
        border: 1px solid rgba(60, 19, 58, 0.08) !important;
        box-shadow: 0 8px 24px rgba(60, 19, 58, 0.06) !important;
    }

    #recent-actions-module h2 {
        border-radius: 1rem 1rem 0 0 !important;
    }

    #recent-actions-module h3 {
        color: #8a7388 !important;
        font-size: 0.8rem !important;
        text-transform: uppercase !important;
        letter-spacing: 0.5px !important;
        padding: 12px 18px 4px 18px !important;
        margin: 0 !important;
    }

    #recent-actions-module ul {
        padding: 8px 18px 18px 18px !important;
        margin: 0 !important;
    }

    #recent-actions-module li {
        color: #555555 !important;
        font-size: 0.85rem !important;
        padding: 4px 0 !important;
    }

    /* --- BOTONES DE ACCIÓN --- */
    .button, input[type=submit], input[type=button], .submit-row input, a.button {
        background: var(--primary-color) !important;
        color: #ffffff !important;
        border-radius: 50rem !important;
        border: none !important;
        padding: 9px 22px !important;
        font-weight: 700 !important;
        box-shadow: 0 4px 12px rgba(60, 19, 58, 0.18) !important;
        transition: all 0.2s ease-in-out !important;
    }

    .button:hover, input[type=submit]:hover {
        background: var(--primary-hover) !important;
        transform: translateY(-1px) !important;
    }

    /* Migas de pan (Breadcrumbs) */
    .breadcrumbs {
        background: #ffffff !important;
        border-radius: 50rem !important;
        padding: 8px 20px !important;
        margin-bottom: 20px !important;
        border: 1px solid rgba(60, 19, 58, 0.08) !important;
        color: #777777 !important;
        font-size: 0.85rem !important;
    }

    .breadcrumbs a {
        color: var(--primary-color) !important;
        font-weight: 600 !important;
    }

    /* --- VISTA DE LOGIN DEL ADMIN --- */
    body.login {
        background: var(--morado-claro) !important;
        height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    body.login #container {
        background: #ffffff !important;
        border-radius: 1.25rem !important;
        box-shadow: 0 15px 35px rgba(60, 19, 58, 0.12) !important;
        border: 1px solid #e8dbe8 !important;
        width: 400px !important;
        max-width: 90vw;
        float: none !important;
        margin: auto !important;
    }

    body.login #header { display: none !important; }

    body.login #content::before {
        content: "Dulce Arte";
        display: block;
        background: var(--primary-color);
        color: #ffffff;
        font-family: 'Great Vibes', cursive;
        font-size: 2.5rem;
        text-align: center;
        padding: 20px 20px 10px 20px;
        border-bottom: 4px solid var(--accent-color);
        margin: -24px -24px 20px -24px;
    }

    body.login .form-row input {
        border-radius: 0.75rem !important;
        border: 1px solid #ced4da !important;
        padding: 12px 15px !important;
        width: 100% !important;
        background: #ffffff !important;
        color: #2b2b2b !important;
    }
</style>
{% endblock %}
