<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dulce Arte - Sabor y Armonía</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --morado-principal: #3c133a; /* Morado oscuro elegante */
            --morado-oscuro: #270b25;
            --morado-claro: #f4eef4;   /* Morado pastel claro y sofisticado */
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--morado-claro) !important; /* Fondo general en morado claro */
        }
        /* Navbar superior limpia (fondo blanco como pediste) */
        .navbar-dulce {
            background-color: #ffffff;
            border-bottom: 1px solid #eaeaea;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            padding-top: 0;
            padding-bottom: 0;
        }
        .logo-cursivo {
            font-family: 'Great Vibes', cursive;
            font-size: 2.2rem;
            color: var(--morado-principal) !important;
            line-height: 1;
            text-decoration: none;
        }
        .nav-section-morada {
            background-color: var(--morado-principal);
            padding: 1rem 2rem;
            border-top-left-radius: 1rem;
            border-bottom-left-radius: 1rem;
        }
        .nav-section-morada .nav-link {
            font-weight: 500;
            color: #ffffff !important;
            transition: opacity 0.2s ease-in-out;
        }
        .nav-section-morada .nav-link:hover {
            opacity: 0.8;
        }
        /* Tarjetas con estilo moderno y limpio sobre el fondo claro */
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(60, 19, 58, 0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 1rem 2rem rgba(60, 19, 58, 0.1);
        }
        .btn-primary {
            background-color: var(--morado-principal);
            border-color: var(--morado-principal);
            border-radius: 50rem;
            padding: 0.5rem 1.5rem;
            font-weight: 600;
        }
        .btn-primary:hover {
            background-color: var(--morado-oscuro);
            border-color: var(--morado-oscuro);
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Barra de Navegación Principal -->
    <nav class="navbar navbar-expand-lg navbar-light navbar-dulce mb-4">
        <div class="container-fluid px-0">
            
            <div class="px-4 py-2 d-flex align-items-center gap-3">
                <a class="logo-cursivo" href="{% url 'dashboard' %}">
                    Dulce Arte
                </a>
                <span class="text-muted small border-start ps-3" style="font-size: 0.75rem; letter-spacing: 1px;">SABOR Y ARMONÍA</span>
            </div>

            <button class="navbar-toggler border-0 me-3" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <div class="nav-section-morada">
                    <ul class="navbar-nav align-items-center gap-3">
                        <li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'kanban' %}">Tablero Kanban</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'crear_pedido' %}">Nuevo Pedido</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'inventario' %}">Inventario (BOM)</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'despachos' %}">Despachos</a></li>
                        <li class="nav-item ms-2">
                            <a class="btn btn-light btn-sm px-3 py-2 fw-semibold rounded-pill text-dark" href="/api/docs/" target="_blank">⚡ API Swagger</a>
                        </li>
                    </ul>
                </div>
            </div>

        </div>
    </nav>

    <div class="container-fluid px-4 flex-grow-1 mb-5">
        {% block content %}{% endblock %}
    </div>

    <footer class="bg-white text-center py-4 mt-auto border-top">
        <div class="container text-muted small">
            Sistema de Trazabilidad y Pedidos | <strong>Dulce Arte</strong> &copy; 2026
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
